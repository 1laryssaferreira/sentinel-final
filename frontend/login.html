<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071321">
  <title>Entrar | Sentinel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23071321'/%3E%3Cpath d='M16 5 8 8v6c0 5 3.3 8.8 8 10.6 4.7-1.8 8-5.6 8-10.6V8z' fill='none' stroke='%2322D3EE' stroke-width='2'/%3E%3Cpath d='m12.5 15 2.5 2.5 4.5-4.6' fill='none' stroke='%2322D3EE' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=42dot+Sans:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <main class="auth-container">
    <a class="auth-voltar" href="index.html">Voltar ao site</a>
    <section class="auth-card" aria-labelledby="loginTitle">
      <a class="auth-marca" href="index.html" aria-label="Sentinel, página inicial">
        <span class="auth-escudo" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 3.5 6 7.2v7.4c0 6.4 4.2 11.2 10 13.4 5.8-2.2 10-7 10-13.4V7.2z"/><path d="m11.5 15.8 3.2 3.2 6-6.2"/></svg></span>
        <span class="auth-nome">Sentinel <small>3.0</small></span>
      </a>
      <header class="auth-header">
        <h1 id="loginTitle">Bem-vindo de volta</h1>
        <p>Entre para acessar o painel de segurança</p>
      </header>

      <div id="loginFeedback" class="form-feedback error" hidden></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
            <button class="password-toggle" type="button" onclick="togglePassword('password', this)" aria-pressed="false">Mostrar</button>
          </div>
        </div>
        <div class="form-row">
          <label class="check-line"><input type="checkbox" id="remember" checked><span>Lembrar de mim</span></label>
          <button class="text-link" type="button" id="esqueciSenha">Esqueci a senha</button>
        </div>
        <button class="primary-button" type="submit">Entrar</button>
      </form>

      <div class="demo-box">
        <div>
          <strong>Conta de teste</strong>
          <span>operador@sentinel.com</span>
        </div>
        <button id="fillDemo" class="small-button" type="button">Preencher</button>
      </div>

      <p class="auth-switch">Ainda não tem conta? <a class="text-link" href="cadastro.html">Cadastre-se</a></p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    document.getElementById('esqueciSenha').addEventListener('click', () => {
      setFeedback(document.getElementById('loginFeedback'),
        'A troca de senha ainda é feita pelo administrador do sistema. Para testar, use a conta de teste abaixo.', 'info');
    });
  </script>
</body>
</html>
